# Local data dependencies for development (Section 12).
# Managed Postgres + managed Redis are used in staging/production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: owo
      POSTGRES_PASSWORD: owo
      POSTGRES_DB: owo
    ports:
      - '5432:5432'
    volumes:
      - owo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U owo']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  owo_pg:
